<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}CompTIA A+ Prep{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% block navbar %}
  <nav class="navbar">
    <a href="{{ url_for('index') }}" class="nav-brand">
      <span class="brand-icon">⬡</span>
      <span class="brand-text">A<span class="brand-plus">+</span> PREP</span>
    </a>
    <button class="nav-hamburger" id="nav-hamburger" onclick="toggleMenu()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links" id="nav-links">
      <a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">Home</a>
      <a href="{{ url_for('study') }}" class="nav-link {% if request.endpoint in ['study','start_study'] %}active{% endif %}">Study</a>
      <a href="{{ url_for('missed') }}" class="nav-link {% if request.endpoint == 'missed' %}active{% endif %}">Missed</a>
      <a href="{{ url_for('history') }}" class="nav-link {% if request.endpoint == 'history' %}active{% endif %}">History</a>
      <a href="{{ url_for('pbq') }}" class="nav-link {% if 'pbq' in request.endpoint %}active{% endif %}">Labs</a>
      <a href="{{ url_for('simulate') }}" class="nav-link nav-link-sim {% if request.endpoint == 'simulate' %}active{% endif %}">Simulate</a>
      <a href="{{ url_for('admin') }}" class="nav-link {% if request.endpoint == 'admin' %}active{% endif %}">Admin</a>
    </div>
  </nav>
  {% endblock %}

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
  <script>
    function toggleMenu() {
      const links = document.getElementById('nav-links');
      const btn = document.getElementById('nav-hamburger');
      links.classList.toggle('open');
      btn.classList.toggle('open');
    }
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        document.getElementById('nav-links').classList.remove('open');
        document.getElementById('nav-hamburger').classList.remove('open');
      });
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
