{% extends "base.html" %}
{% block title %}Quiz — CompTIA A+ Prep{% endblock %}
{% block content %}
<div class="quiz-shell">
  <div class="quiz-header">
    <div class="quiz-meta">
      <span id="q-counter" class="q-counter">1 / {{ total }}</span>
      <span class="domain-tag" id="domain-tag"></span>
    </div>
    <div class="timer-wrap">
      <span class="timer-icon">⏱</span>
      <span id="timer" class="timer-display">--:--</span>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progress-bar" style="width:0%"></div>
  </div>

  <div class="question-area" id="question-area">
    <div class="loading-pulse">Loading question…</div>
  </div>

  <div class="quiz-nav">
    <button class="btn-nav" id="btn-prev" onclick="prevQuestion()" disabled>← Prev</button>
    <div class="dots" id="dots"></div>
    <button class="btn-nav" id="btn-next" onclick="nextQuestion()">Next →</button>
  </div>

  <button class="btn-submit" id="btn-submit" onclick="submitQuiz()" style="display:none">
    Submit Quiz
  </button>
</div>

<div class="confirm-overlay" id="confirm-overlay" style="display:none">
  <div class="confirm-box">
    <h3>Submit Quiz?</h3>
    <p id="unanswered-msg"></p>
    <div class="confirm-btns">
      <button class="btn-cancel" onclick="closeConfirm()">Keep Going</button>
      <button class="btn-confirm" onclick="confirmSubmit()">Submit Now</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const QUESTION_IDS = {{ question_ids | tojson }};
const TIME_LIMIT   = {{ time_limit }};
const EXAM         = {{ exam | tojson }};
const PASSING_SCORE = {{ passing_score }};
</script>
{% endblock %}
